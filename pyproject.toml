[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[too.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["scripts/", "tests/"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["src/cli/*"]

[tool.coverage.report]
show_missing = true